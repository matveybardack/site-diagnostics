[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site_diag"
version = "1.0.0"
description = "Диагностика отказа сайта на основе байесовской сети доверия"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
site_diag = ["ui/styles.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
